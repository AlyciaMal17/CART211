<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Beast Within | The Forbidden Forest</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script></head><body>
<div class="trail" data-step="1"></div>
<div class="stage">
  <div class="place">The Forbidden Forest</div>
  <div class="speech">Something rustles in the trees, close by. Two yellow eyes blink in the dark. What do you do?</div>
  <div class="opts">
    <div class="card" data-opt="investigate">Investigate<small>Step closer</small></div>
    <div class="card" data-opt="run">Run<small>Back to the castle</small></div>
    <div class="card" data-opt="hide">Hide<small>Stay very still</small></div>
  </div>
</div>
<script src="tracker.js"></script>
<script>
Beast.begin('forest');
Beast.options('.card',{investigate:{niffler:1,phoenix:2},run:{bowtruckle:2},hide:{thestral:2}},'hut.html');
let tr=[];
function setup(){createCanvas(windowWidth,windowHeight);for(let l=0;l<3;l++)for(let i=0;i<12;i++)tr.push({l,x:random(width),w:random(20,50)*(l+1)*.7})}
function windowResized(){resizeCanvas(windowWidth,windowHeight)}
function draw(){
  background(8,14,18);noStroke();
  fill(200,210,190,40);circle(width*.8,height*.18,140);fill(225,230,210);circle(width*.8,height*.18,70);
  for(let i=0;i<3;i++){const ex=width*(.2+i*.28),ey=height*(.5+.04*(i%2));
    if((frameCount+i*90)%260>14){fill(255,220,80);ellipse(ex,ey,14,8);ellipse(ex+30,ey,14,8)}}
  for(const t of tr){const o=(mouseX/width-.5)*-(t.l*16);fill(26-t.l*9,42-t.l*13,38-t.l*11);rect(t.x+o,-10,t.w,height+20)}
  for(let i=0;i<8;i++){fill(150,170,170,14);ellipse((noise(i,frameCount*.002)*1.4-.2)*width,height*(.45+i*.07),width*.5,90)}
}
</script></body></html>
