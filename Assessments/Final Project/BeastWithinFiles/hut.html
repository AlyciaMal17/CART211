<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Beast Within | Hagrid's Hut</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script></head><body>
<div class="trail" data-step="2"></div>
<div class="stage">
  <div class="place">Hagrid's Hut</div>
  <div class="speech"><div class="who" id="who"></div><div id="say"></div><div class="hint" id="hint">click to continue ▸</div></div>
  <div class="opts" id="opts" style="display:none">
    <div class="card" data-opt="rock">Rock cake<small>Crunchy. Very crunchy.</small></div>
    <div class="card" data-opt="tart">Treacle tart<small>Warm and sticky</small></div>
    <div class="card" data-opt="stew">Mystery stew<small>Don't ask what's in it</small></div>
  </div>
  <button class="btn" id="cont" style="display:none">Continue</button>
</div>
<script src="tracker.js"></script><script src="story.js"></script>
<script>
const intro=[
 ['Narrator','Rain hammers on a crooked little chimney. You knock on a heavy wooden door, and a voice like rolling thunder answers.'],
 ['Hagrid','Door\'s open! Come in, come in. Mind the dog.'],
 ['Narrator','Inside, the hut smells of woodsmoke, wet wool and something bubbling. Fang, an enormous boarhound, takes up most of the couch.'],
 ['Hagrid','Yeh look half-drowned! Sit down. I\'ve been cookin\' all mornin\'.'],
 ['Hagrid','Go on, have a bit o\' somethin\'. Don\' be shy now.']];
const outcomes={
 rock:[['Hagrid','Rock cake! Me own recipe. A bit tough, but yeh\'ll get used ter it.'],['Narrator','CRACK. You are fairly sure that was a tooth. On the couch, Fang\'s ears shoot up, hoping for crumbs.'],['The Sorting Hat','Stubborn, or just polite? Hmm. I will remember that.']],
 tart:[['Hagrid','Good choice! Still hot from the fire.'],['Narrator','It is sticky, sweet and perfect. Fang watches every bite and lets out a very long, very sad whine.'],['The Sorting Hat','A loyal heart, I think. Hmm. I will remember that.']],
 stew:[['Hagrid','Ah, me special stew. Don\' ask what\'s in it, just eat.'],['Narrator','Something in the pot blinks at you. The stew tastes of smoke, pepper and mild regret. A puff of purple steam escapes.'],['The Sorting Hat','A strange one. I like it. I will remember that.']]};
Story.play(intro,()=>{opts.style.display='flex';Beast.begin('hut')});
Beast.options('.card',{rock:{bowtruckle:1,hippogriff:1},tart:{hippogriff:2},stew:{nargle:2,niffler:1}},o=>{
  opts.style.display='none';fx=o;f0=frameCount;Story.play(outcomes[o],()=>cont.style.display='inline-block')});
cont.onclick=()=>Beast.go('next.html');

let bg,steam=[],sparks=[],fx=null,f0=0;
function setup(){createCanvas(windowWidth,windowHeight);makeBg()}
function windowResized(){resizeCanvas(windowWidth,windowHeight);makeBg()}
function patch(g,x,y,s){g.fill(random([[150,110,60],[70,90,70],[130,100,130],[170,140,90],[60,70,120]]));g.noStroke();g.rect(x,y,s,s);g.stroke(220,200,160,150);g.strokeWeight(1);g.drawingContext.setLineDash([4,3]);g.noFill();g.rect(x+3,y+3,s-6,s-6);g.drawingContext.setLineDash([])}
function makeBg(){const w=width,h=height,g=createGraphics(w,h);randomSeed(5);g.noStroke();
  for(let x=0;x<w;x+=w/16){g.fill(random(48,70),random(32,46),random(20,32));g.rect(x,0,w/16-2,h*.66)}               // wooden wall
  g.fill(32,21,14);g.rect(0,0,w,h*.06);g.rect(w*.34,0,w*.02,h*.66);g.rect(0,h*.62,w,h*.04);                               // beam, post, skirting
  for(let i=0;i<8;i++){const x=w*(.38+i*.075);if(i%3==0){g.stroke(80,60,40);g.strokeWeight(2);g.line(x,h*.06,x,h*.14);g.noStroke();g.fill(150,80,40);g.ellipse(x,h*.17,w*.03,h*.05);g.fill(90,50,28);g.ellipse(x,h*.15,w*.02,h*.015)}     // copper pots
    else{g.stroke(80,60,40);g.strokeWeight(2);g.line(x,h*.06,x,h*.2);g.noStroke();for(let k=0;k<4;k++){g.fill(i%2?[200,170,90]:[190,150,70]);g.ellipse(x+(k%2)*5-2,h*.1+k*h*.025,w*.014,h*.028)}}}   // onions and garlic
  g.fill(52,44,40);g.rect(w*.05,h*.09,w*.17,h*.27);g.fill(60,74,108);g.rect(w*.065,h*.11,w*.14,h*.23);g.stroke(40,28,20);g.strokeWeight(5);g.line(w*.135,h*.11,w*.135,h*.34);g.line(w*.065,h*.225,w*.205,h*.225);g.noStroke();
  g.fill(110,40,36);g.quad(w*.05,h*.09,w*.085,h*.09,w*.08,h*.36,w*.05,h*.36);g.quad(w*.22,h*.09,w*.185,h*.09,w*.19,h*.36,w*.22,h*.36);   // window + curtains
  g.fill(100,92,86);g.rect(w*.52,h*.1,w*.3,h*.54);for(let i=0;i<90;i++){g.fill(random(70,125),random(64,115),random(60,105));g.rect(random(w*.52,w*.8),random(h*.1,h*.62),random(14,30),random(10,18),3)}   // stone fireplace
  g.fill(12,7,5);g.rect(w*.575,h*.27,w*.19,h*.37);g.arc(w*.67,h*.27,w*.19,h*.1,PI,TWO_PI);g.fill(40,26,16);g.rect(w*.5,h*.1,w*.34,h*.03);g.fill(180,60,50);g.rect(w*.54,h*.07,w*.012,h*.03);g.fill(200,190,160);g.rect(w*.6,h*.075,w*.01,h*.025);   // opening, mantle, candles
  for(let s=0;s<3;s++){const y=h*(.24+s*.14);g.fill(44,28,18);g.rect(w*.84,y,w*.14,h*.012);for(let i=0;i<5;i++){const bw=random(.012,.022)*w,bh=random(.04,.07)*h;g.fill(random([[120,60,40],[60,100,70],[160,140,80],[90,70,110],[170,170,160]]));g.rect(w*.85+i*w*.026,y-bh,bw,bh,2)}}   // shelves
  g.fill(80,18,22);g.ellipse(w*.17,h*.655,w*.34,h*.05);g.fill(190,150,70);g.ellipse(w*.17,h*.655,w*.26,h*.03);g.fill(80,18,22);g.ellipse(w*.17,h*.655,w*.2,h*.022);   // rug
  g.fill(100,44,38);g.rect(w*.04,h*.33,w*.28,h*.3,24);g.rect(w*.025,h*.42,w*.05,h*.2,18);g.rect(w*.28,h*.42,w*.05,h*.2,18);g.fill(125,56,46);g.rect(w*.055,h*.5,w*.24,h*.12,16);   // big couch
  for(let i=0;i<9;i++)patch(g,w*.05+(i%3)*w*.07,h*.36+floor(i/3)*h*.045,w*.03);patch(g,w*.03,h*.5,w*.025);patch(g,w*.288,h*.5,w*.025);
  g.noStroke();g.fill(30,18,12);g.rect(w*.05,h*.62,w*.02,h*.03);g.rect(w*.29,h*.62,w*.02,h*.03);
  g.fill(78,50,32);g.rect(0,h*.66,w,h*.34);g.fill(96,64,42);g.rect(0,h*.66,w,6);g.stroke(60,38,24);for(let i=0;i<30;i++){g.strokeWeight(1);g.line(0,h*.67+i*h*.012,w,h*.67+i*h*.012+random(-2,2))}
  bg=g}
function hagrid(x,y,s){const sp=Story.state.who==='Hagrid'&&Story.state.typing,bob=sp?sin(frameCount*.5)*s*.012:0;push();translate(x,y);noStroke();
  fill(25,16,12);rect(-.2*s,-.14*s,.16*s,.14*s,6);rect(.04*s,-.14*s,.16*s,.14*s,6);fill(62,42,30);ellipse(0,-.42*s,.74*s,.74*s);                // boots, big coat
  fill(80,56,40);ellipse(-.08*s,-.46*s,.3*s,.55*s);fill(30,20,14);rect(-.32*s,-.38*s,.64*s,.05*s);fill(200,160,60);rect(-.04*s,-.385*s,.08*s,.06*s);     // coat shine, belt, buckle
  for(let k=0;k<4;k++)circle(.1*s,-.62*s+k*.08*s,.035*s);fill(110,80,50);rect(.12*s,-.28*s,.1*s,.1*s);
  fill(48,32,22);ellipse(-.34*s,-.4*s,.14*s,.4*s);fill(225,175,145);circle(-.34*s,-.2*s,.06*s);                                                        // left arm hangs
  fill(18,12,10);ellipse(0,-.88*s,.4*s,.34*s);for(let k=0;k<9;k++){push();translate(0,-.9*s);rotate(-1.4+k*.35);ellipse(0,-.2*s,.05*s,.16*s);pop()}       // wild hair
  fill(225,175,145);circle(0,-.86*s,.24*s);fill(18,12,10);ellipse(0,-.78*s+bob,.34*s,.24*s);ellipse(-.1*s,-.7*s+bob,.14*s,.2*s);ellipse(.1*s,-.7*s+bob,.14*s,.2*s);ellipse(0,-.66*s+bob,.2*s,.18*s);   // face + beard
  fill(210,140,120);ellipse(0,-.84*s,.05*s,.045*s);fill(240);circle(-.045*s,-.9*s,.032*s);circle(.045*s,-.9*s,.032*s);fill(10);circle(-.045*s,-.9*s,.02*s);circle(.045*s,-.9*s,.02*s);
  stroke(18,12,10);strokeWeight(s*.02);line(-.08*s,-.94*s,-.02*s,-.925*s);line(.08*s,-.94*s,.02*s,-.925*s);pop()}
function fang(x,y,f,t){push();translate(x,y+sin(frameCount*.05)*1.5);noStroke();const wag=fx==='tart'?.4:fx?.2:.1;
  stroke(140,105,70);strokeWeight(f*.1);line(-.38*f,-.25*f,-.65*f,-.45*f+sin(frameCount*wag*2)*.12*f);noStroke();
  fill(150,115,78);ellipse(0,-.5*f,.85*f,.95*f);ellipse(-.22*f,-.2*f,.55*f,.45*f);fill(185,150,110);ellipse(.2*f,-.45*f,.4*f,.6*f);rect(.12*f,-.3*f,.14*f,.3*f,6);rect(.3*f,-.3*f,.14*f,.3*f,6);fill(130,96,62);ellipse(.19*f,0,.22*f,.1*f);ellipse(.37*f,0,.22*f,.1*f);
  fill(150,115,78);ellipse(.22*f,-1*f,.5*f,.48*f);fill(172,138,98);ellipse(.46*f,-.92*f,.38*f,.26*f);fill(120,85,60);ellipse(.5*f,-.84*f,.34*f,.1*f);fill(15);circle(.62*f,-.97*f,.08*f);
  if(fx==='tart'||fx==='rock'||sin(frameCount*.08)>.3){fill(210,100,110);ellipse(.5*f,-.78*f,.1*f,.14*f*(.8+.2*sin(frameCount*.3)))}
  fill(20);circle(.34*f,-1.04*f,.05*f);fill(255);circle(.35*f,-1.05*f,.015*f);stroke(70,50,35);strokeWeight(2);line(.28*f,-1.1*f,.4*f,-1.08*f);noStroke();
  fill(95,65,45);push();translate(.1*f,-1.15*f);rotate(fx==='rock'?-.5:.2+sin(frameCount*.04)*.04);ellipse(-.02*f,fx==='rock'?-.1*f:.15*f,.16*f,.36*f);pop();pop()}
function draw(){
  const w=width,h=height,c=drawingContext,t=fx?min((frameCount-f0)/170,1):0,fxp=w*.67,fyb=h*.64,potx=w*.67,poty=h*.42;
  push();if(fx==='rock'&&t<.25)translate(random(-5,5),random(-3,3));image(bg,0,0);
  stroke(150,170,210,120);strokeWeight(1);for(let i=0;i<26;i++){const x=w*.065+((i*53)%100)/100*w*.14,y=h*.11+((frameCount*4+i*47)%(h*.21));line(x,y,x-2,y+10)}   // rain in window
  noStroke();fill(48,30,18);rect(fxp-w*.07,fyb-h*.035,w*.14,h*.035,8);                                                    // logs + flames
  for(let i=0;i<10;i++){const x=fxp-w*.065+i*w*.0145,fh=h*(.07+.13*noise(i*3,frameCount*.06))*(i>2&&i<7?1.3:1),b=fyb-h*.035;
    fill(255,90,20,200);ellipse(x,b-fh/2,w*.022,fh);fill(255,170,40,210);ellipse(x,b-fh*.4,w*.014,fh*.7);fill(255,240,160,220);ellipse(x,b-fh*.25,w*.007,fh*.4)}
  stroke(40);strokeWeight(3);line(potx,h*.26,potx,poty-h*.09);noStroke();                                                 // pot on chain
  fill(16,14,14);arc(potx,poty,h*.24,h*.22,0,PI);fill(55);ellipse(potx,poty,h*.24,h*.045);fill(fx==='stew'?[110,60,130]:[105,100,40]);ellipse(potx,poty,h*.2,h*.03);
  for(let i=0;i<4;i++){fill(150,150,60,150);circle(potx+(i-1.5)*h*.035,poty+sin(frameCount*.12+i*2)*3,h*.014)}
  if(fx==='stew'&&t>.12){fill(240);circle(potx+h*.02,poty,h*.03);fill(10);circle(potx+h*.02+sin(frameCount*.05)*3,poty,h*.014)}   // the stew blinks
  steam.push({x:potx+random(-.04,.04)*w,y:poty-h*.02,vy:random(.5,1.1),r:random(10,18),a:110});
  for(let i=steam.length-1;i>=0;i--){const p=steam[i];p.y-=p.vy;p.r+=.25;p.a-=.8;if(p.a<=0){steam.splice(i,1);continue}fill(fx==='stew'?[190,130,220,p.a]:[210,210,210,p.a*.6]);circle(p.x+sin(p.y*.04)*6,p.y,p.r)}
  const a=frameCount*.07,hx=potx-w*.07+cos(a)*8,hy=poty-h*.17+sin(a)*5,sx=w*.45+h*.17,sy=h*.64-h*.52*.6;                    // Hagrid + stirring arm
  hagrid(w*.45,h*.64,h*.52);const ex=(sx+hx)/2,ey=(sy+hy)/2+h*.05;stroke(55,38,27);strokeWeight(h*.06);noFill();line(sx,sy,ex,ey);line(ex,ey,hx,hy);
  stroke(70,50,35);strokeWeight(5);line(hx,hy,potx+cos(a)*h*.03,poty+h*.01);noStroke();fill(225,175,145);circle(hx,hy,h*.035);
  fang(w*.18,h*.585,h*.2,t);
  if(fx==='rock'&&t<.8){textAlign(CENTER);textFont('Cinzel');textSize(64);fill(255,220,120,255*(1-t));text('CRUNCH!',w*.5,h*.3-t*50)}
  if(fx==='tart'&&frameCount%2==0)sparks.push({x:random(w*.3,w*.7),y:h*.62,v:random(.8,2),r:random(2,5)});
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.y-=p.v;p.x+=sin(p.y*.05);if(p.y<h*.2){sparks.splice(i,1);continue}fill(255,220,100,200);circle(p.x,p.y,p.r)}
  pop();
  const g2=c.createRadialGradient(fxp,h*.5,10,fxp,h*.5,w*.55);g2.addColorStop(0,'rgba(255,130,40,'+(.22+.1*noise(frameCount*.05)+(fx==='tart'?.1*t:0))+')');g2.addColorStop(1,'rgba(255,130,40,0)');c.fillStyle=g2;c.fillRect(0,0,w,h);
  const vg=c.createRadialGradient(w/2,h*.5,h*.3,w/2,h*.5,max(w,h)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.6)');c.fillStyle=vg;c.fillRect(0,0,w,h)}
</script></body></html>
