<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Beast Within | Hagrid's Hut</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script></head><body>
<div class="trail" data-step="2"></div>
<div class="stage">
  <div class="place">Hagrid's Hut</div>
  <div class="speech">"Yeh look hungry. Go on, have a bit o' somethin'. Made it meself."</div>
  <div class="opts">
    <div class="card" data-opt="rock">Rock cake<small>Crunchy. Very crunchy.</small></div>
    <div class="card" data-opt="tart">Treacle tart<small>Warm and sticky</small></div>
    <div class="card" data-opt="stew">Mystery stew<small>Don't ask what's in it</small></div>
  </div>
</div>
<script src="tracker.js"></script>
<script>
Beast.begin('hut');
Beast.options('.card',{rock:{bowtruckle:1,hippogriff:1},tart:{hippogriff:2},stew:{nargle:2,niffler:1}},'next.html');
function setup(){createCanvas(windowWidth,windowHeight)}
function windowResized(){resizeCanvas(windowWidth,windowHeight)}
function draw(){
  const w=width,h=height;background(43,26,18);
  stroke(30,18,12);strokeWeight(2);for(let x=0;x<w;x+=70)line(x,0,x,h);
  fill(15,22,48);rect(w*.7,h*.1,w*.18,h*.28);noFill();stroke(90,58,36);strokeWeight(6);
  rect(w*.7,h*.1,w*.18,h*.28);line(w*.79,h*.1,w*.79,h*.38);line(w*.7,h*.24,w*.88,h*.24);noStroke();
  fill(255,140,40,18+12*noise(frameCount*.05));circle(w*.14,h*.45,w*.5);
  fill(90,80,72);rect(w*.06,h*.2,w*.16,h*.38);fill(15,8,5);rect(w*.085,h*.3,w*.11,h*.28);
  for(let i=0;i<7;i++){const fh=h*(.05+.08*noise(i,frameCount*.05));fill(255,110+i*14,30,210);ellipse(w*.09+i*w*.015,h*.58-fh/2,w*.02,fh)}
  hagrid(w*.5,h*.42+sin(frameCount*.03)*4,min(w,h)*.5);
  fill(70,44,28);rect(0,h*.66,w,h);fill(55,34,22);rect(0,h*.66,w,8);
}
function hagrid(x,y,s){push();translate(x,y);noStroke();
  fill(60,40,30);ellipse(0,s*.4,s*.95,s*.8);
  fill(40,26,18);ellipse(0,-s*.12,s*.42,s*.4);
  fill(220,170,140);circle(0,-s*.1,s*.28);
  fill(40,26,18);ellipse(0,s*.03,s*.36,s*.3);
  fill(20);circle(-s*.05,-s*.13,s*.025);circle(s*.05,-s*.13,s*.025);
  fill(200,150,120);ellipse(0,-s*.07,s*.05,s*.04);pop()}
</script></body></html>
