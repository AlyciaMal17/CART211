<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Video</title>
    <style>
              /* Remove default spacing and makes the page fill the screen */
      *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }
      /*Sets the main page dimensions and default font*/
      body{
          font-family: Arial, Helvetica, sans-serif;
          min-height: 100vh;
          color: white;
          background-color: black;
      }

      /* Positions the video behind the entire */
      .background-video {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%


          object-fit:cover;
          object-position: center;

          z-index: -1;
          /*Places the video behind the content*/
      }

       /*Adds a dark overlay to make text easier to read*/
       .overlay {
          position: fixed;
          top: 0%;
          left:0%;
          width: 100%;
          height: 100%;

          background-color: rgba 0, 0, 0, 0.4;
          /*The last value controls darkness: 0 is transparent, 1 is opaque */
          z-index: 0;
       }
      /*Position the website content above the video and overlay*/
      .content {
          position: relative;
          z-index: 1;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center; /* centers content vertically */
          align-items: center;/* centers content horizontally */
      }
      h1{
        font-size: clamp (2rem, 5vw, 4rem);
        margin-bottom: 15px;
      }

      p{
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <!-- BG video that plays automatically and repeats-->
    <video
      class="background-video"
      autoplay
      muted
      loop
      playsinline
      aria-hidden="true"
      tabindex="-1"
    >
      <source src="VideoBeach.mp4" type="video/mp4" />
    </video>
    <!-- Darkens the BG video so that the text is visible-->
     <div class="overlay"></div>
     <main class="content">
        <h1> Beach Video</h1>
        <p>This is an example of background video</p>
     </main>
  </body>
</html>
