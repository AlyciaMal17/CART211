<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beach Video</title>
    <style>
      body {
        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",
          Arial, sans-serif;
        margin: 20px;
      }

      /*Style the video player*/
      video {
        display: block;
        /* places video on its own line */
        width: 100%;
        /* makes the video fill the available content width*/
        aspect-ratio: 16 / 9;
        /* set a standard widescreen video ratio */
        height: auto;
        background-color: black;
      }
    </style>
  </head>

  <body>
    <h1>Beach Video</h1>
    <p>Watch the video below</p>

    <!-- Creates a video with a built-in playback controls-->
    <video controls>
      <!-- Loads the mp4 video file from the same folder as this HTML file-->
      <source src="VideoBeach.mp4" type="video/mp4" />

      <!-- Displays this message of this browser cannot play the video-->
      Sorry, your browser cannot play this video.
    </video>
  </body>
</html>
